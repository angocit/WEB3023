<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            max-width: 1100px;
            margin: auto;
        }
        .main{
            display: grid;
            grid-template-columns: 25% 25% 25% 25%;
            gap: 10px;
        }
        span{background-color: #aaa;min-height: 200px;}
        .main span:first-child{
            grid-row: 1/3;
            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="main">
        <span>Item 1</span>
        <span>Item 2</span>
        <span>Item 3</span>
        <span>Item 4</span>
        <span>Item 5</span>
    </div>
    </div>
</body>
</html>
