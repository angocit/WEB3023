<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root{
            /* Tất cả các biến sẽ khai báo ở đây */
            /* --tenbien: giá_trị */
            --main-color: #136dc2;
            --second-color: #c2131f;
            --text-color: #666;
            --text-white-color:#fff;
        }        
        button{
            background-color: var(--main-color);
            color: var(--text-white-color);
        }
        /* Sử dụng font */
        /* Khai báo*/
        @font-face{
            font-family: "Playwrite";
            src: url("fonts/PlaywriteHU-Regular.ttf");
         }
         h1{
            color: var(--text-color);
            font-family: "Playwrite";
        }
        .content{
            max-width: 1200px; margin: auto;
            display: grid;
            /* grid-template-columns: 25% 75%;  */
            /* cách 2 */
            grid-template-columns: 300px 1fr;
            /* Trong đó: 1fr là lấy phần còn lại  */
        }
        .products{
            display: grid;
            /* grid-template-columns: 1fr 1fr 1fr 1fr; cách 1 */
             /* grid-template-columns: 30% 20% 20% 20%; cách 2  */
              grid-template-columns: repeat(4,1fr);
              row-gap: 10px;
              column-gap: 20px;
        }
        .products .item{
            border:1px solid #ccc;
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .products .item:first-child{
            grid-column: 1/3;
            grid-row: 1/3;
        }
        /* // Responsive:  */
        /* media query  */
        /* Màn hình di động  */
        @media screen and (max-width:720px) {
            aside{display: none;}
         .products{
             grid-template-columns: repeat(2,1fr);   
         }
         .content{
            grid-template-columns: 1fr;
        } 
        }
        /* Màn hình cho tablelet  */
        @media screen and (max-width:980px) {
             .content{
            grid-template-columns: 1fr;
        } 
        .products{
             grid-template-columns: repeat(3,1fr);   
         }
        }
        /* Màn hình desktop */
        @media screen and (min-width:980px) {
            
        }
    </style>
</head>
<body>
    <h1>Xin chào HTML5 & CSS3 <i class="fa-solid fa-magnifying-glass"></i></h1>
    <button><i class="fa-solid fa-location-dot"></i> Click here!</button>
    <div class="content">
        <aside>Sidebar</aside>
        <main>
            <h1>Danh sách sản phẩm</h1>
            <div class="products">
                <div class="item">
                    <span>Sản phẩm 1</span>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 2</h3>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 3</h3>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 4</h3>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 5</h3>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 6</h3>
                    <span>Giá: 300.000</span>
                </div>
                <div class="item">
                    <h3>Sản phẩm 7</h3>
                    <span>Giá: 300.000</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
