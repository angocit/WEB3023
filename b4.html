<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="background">
        <h1>Hello VietNam</h1>
    </div>
    <style>
        #background{
            width: 600px;
            height: 500px;
            /* background: linear-gradient(45deg, #ff0000, #fff); */
            /* background: radial-gradient(circle,#ff0000,#fff); */
            /* box-shadow: 0px 0px 10px #ccc; */
            background-color: red;
            transition: all 2s ease;
            position: relative;
        }
        /* h1{
            position: absolute;
            top: 0;
            left: 0;
            animation: chuyendongchu 4s linear infinite
        } */
        #background:hover{
            transform: rotate(360deg);
            opacity: 0.5;
        }
        h1{
            text-shadow: 5px 5px 5px #ff0000;
        }
        @keyframes chuyendongchu {
            0%{
                top: 0;
                left: 0;
            }
            25%{
                top: 0;
                left: 100%;
            }
            50%{
                top: 100%;
                left: 100%;
            }
            75%{
                top: 100%;
                left: 0;
            }
            100%{
                top: 0;
                left: 0;
            }
        }
    </style>
</body>
</html>
